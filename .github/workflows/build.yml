name: LibreOffice Lite Binary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build LibreOffice
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64-linux-android, arm-linux-androideabi]

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add 12GB Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libkrb5-dev nasm graphviz python3 python3-dev autoconf libxaw7-dev libcups2-dev openjdk-17-jdk ant default-jdk flex bison gperf libfontconfig1-dev libarchive-zip-perl

      - name: Set NDK Home
        run: |
          echo "ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/*/ | tail -1)" >> $GITHUB_ENV

      - name: Clone LibreOffice Core
        run: |
          git clone --depth 1 https://github.com/LibreOffice/core.git libreoffice

      - name: Disable NSS in Android build scripts
        working-directory: libreoffice
        run: |
          sed -i '/libxmlsec1-nss\.a/d' bin/lo-all-static-libs
          sed -i '/^NSSLIBS = /,/^$/c\NSSLIBS =' android/Bootstrap/Makefile.shared
          echo "=== Confirming the nss xmlsec archive reference is gone ==="
          grep -n "libxmlsec1" bin/lo-all-static-libs || true
          echo "=== Confirming NSSLIBS is now empty ==="
          grep -n "^NSSLIBS" android/Bootstrap/Makefile.shared

      - name: Generate autogen.input
        working-directory: libreoffice
        run: |
          cat << EOF > autogen.input
          --with-distro=LibreOfficeAndroid
          --with-android-ndk=${ANDROID_NDK_HOME}
          --with-android-sdk=${ANDROID_HOME}
          --host=${{ matrix.arch }}
          --enable-optimized
          --enable-release-build
          --disable-nss
          --disable-skia
          --disable-database-connectivity
          --disable-mariadb-sdbc
          --disable-postgresql-sdbc
          --disable-firebird-sdbc
          --disable-report-builder
          --disable-scripting
          --disable-scripting-beanshell
          --disable-scripting-javascript
          --disable-librelogo
          --disable-avmedia
          --disable-extensions
          --disable-ext-wiki-publisher
          --disable-ext-nlpsolver
          --disable-sdremote
          --disable-sdremote-bluetooth
          --disable-coinmp
          --disable-pdfimport
          --disable-pdfium
          --disable-lotuswordpro
          --disable-zxing
          --disable-libcmis
          --disable-formula-logger
          --disable-online-update
          --disable-breakpad
          --without-java
          --without-webdav
          --without-galleries
          --without-help
          --without-myspell-dicts
          EOF

      - name: Run Autogen
        working-directory: libreoffice
        run: ./autogen.sh

      - name: Compile LibreOffice
        working-directory: libreoffice
        run: make build

      - name: Verify Dependencies
        working-directory: libreoffice
        run: |
          SO_FILE=$(find . -name "liblo-native-code.so" | head -n 1)
          if [ -n "$SO_FILE" ]; then
            echo "=== NEEDED shared libraries ==="
            readelf -d "$SO_FILE" | grep NEEDED
            echo "=== File size ==="
            ls -lh "$SO_FILE"
          fi

      - name: Package Binary and Assets
        working-directory: libreoffice
        run: |
          mkdir -p /tmp/lo-output/assets/unpack
          SO_FILE=$(find . -name "liblo-native-code.so" | head -n 1)
          if [ -n "$SO_FILE" ]; then
            ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded "$SO_FILE"
            cp "$SO_FILE" /tmp/lo-output/
            echo "=== Stripped size ==="
            ls -lh /tmp/lo-output/liblo-native-code.so
          else
            exit 1
          fi
          cp -r instdir/program /tmp/lo-output/assets/unpack/
          cp -r instdir/share /tmp/lo-output/assets/
          rm -rf /tmp/lo-output/assets/share/gallery
          rm -rf /tmp/lo-output/assets/share/extensions
          rm -rf /tmp/lo-output/assets/share/template
          rm -rf /tmp/lo-output/assets/share/config/images*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-android-build-${{ matrix.arch }}
          path: /tmp/lo-output/
